# Minimal standalone Apache config for CI tests. Started by tests/run_apache_test.sh,
# which exports MODULE_DIR, TEST_ROOT, REPO_ROOT and RUN_USER; Apache reads ${VAR}
# from the environment when it isn't Define'd.
ServerRoot "${TEST_ROOT}"
Listen 127.0.0.1:8080
PidFile "${TEST_ROOT}/httpd.pid"
ServerName localhost

<IfModule !mpm_event_module>
    LoadModule mpm_event_module ${MODULE_DIR}/mod_mpm_event.so
</IfModule>
<IfModule !authz_core_module>
    LoadModule authz_core_module ${MODULE_DIR}/mod_authz_core.so
</IfModule>
<IfModule !unixd_module>
    LoadModule unixd_module ${MODULE_DIR}/mod_unixd.so
</IfModule>
<IfModule !log_config_module>
    LoadModule log_config_module ${MODULE_DIR}/mod_log_config.so
</IfModule>
<IfModule !mime_module>
    LoadModule mime_module ${MODULE_DIR}/mod_mime.so
</IfModule>
<IfModule !rewrite_module>
    LoadModule rewrite_module ${MODULE_DIR}/mod_rewrite.so
</IfModule>

User  ${RUN_USER}
Group ${RUN_USER}

ErrorLog  "${TEST_ROOT}/error.log"
LogLevel  warn rewrite:trace2
CustomLog "${TEST_ROOT}/access.log" "%h \"%r\" %>s %{Location}o"
TypesConfig /dev/null
AddType text/html .html

Define REDIRECT_MAP_DIR ${TEST_ROOT}/maps
Define PRESERVICA_HOME  https://digital.library.uni.edu/
Define ARK_NAAN         32498

<VirtualHost 127.0.0.1:8080>
    ServerName  scholarworks.uni.edu
    DocumentRoot "${REPO_ROOT}/apache/www"
    <Directory "${REPO_ROOT}/apache/www">
        Require all granted
    </Directory>
    ErrorDocument 404 /moved.html
    ErrorDocument 410 /moved.html
    Include "${REPO_ROOT}/apache/ark.conf"
    Include "${REPO_ROOT}/apache/redirects.conf"
</VirtualHost>

# Stand-in for the library website, set up as in library-vhost-example.conf: the ARK
# rules first, then a typical CMS catch-all that sends every other path to the site.
<VirtualHost 127.0.0.1:8080>
    ServerName  library.uni.edu
    DocumentRoot "${TEST_ROOT}/site"
    <Directory "${TEST_ROOT}/site">
        Require all granted
    </Directory>
    Include "${REPO_ROOT}/apache/ark.conf"
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
    RewriteRule ^ /index.html [L]
</VirtualHost>
