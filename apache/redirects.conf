# UNI ScholarWorks (Digital Commons) -> Preservica redirects.
#
# Include this file inside the <VirtualHost> for scholarworks.uni.edu
# (see apache/vhost-example.conf).
#
# The lookup files come from redirects.csv: scripts/install_maps.sh builds them with
# scripts/build_map.py and httxt2dbm. Apache re-reads a lookup file whenever it
# changes, so new redirects take effect without a reload.
#
# Requires mod_rewrite, and these defined before the Include:
#   Define REDIRECT_MAP_DIR  /etc/httpd/redirects/current
#   Define PRESERVICA_HOME   https://digital.library.uni.edu/
#
# NE (no escape) on each redirect sends the stored address out exactly as written.
# Without it Apache re-encodes %, turning Preservica's sdb%3AIO%7C... into the
# broken sdb%253AIO%257C.... build_map.py makes sure stored addresses are encoded.
#
# Matching ignores upper/lower case, a trailing slash and any query string.

RewriteEngine On

RewriteMap dcpath    "dbm:${REDIRECT_MAP_DIR}/dc_paths.db"
RewriteMap dcarticle "dbm:${REDIRECT_MAP_DIR}/dc_article.db"
RewriteMap lc        int:tolower

# ---------------------------------------------------------------------------
# Old file addresses (redirects.csv rows whose dc_path is a file link), 301.
#   /cgi/viewcontent.cgi?article=1001&context=unigreek_images (parameters in any order)
#   /context/unigreek_images/article/1001/viewcontent/anything.jpg
# ---------------------------------------------------------------------------

RewriteCond %{QUERY_STRING} (?:^|&)article=(\d+)(?:&|$)
RewriteRule ^/cgi/viewcontent\.cgi$ - [E=DC_ARTICLE:%1]

RewriteCond %{QUERY_STRING} (?:^|&)context=([^&]+)
RewriteCond ${dcarticle:${lc:%1}/%{ENV:DC_ARTICLE}|NONE} ^(https://.+)$
RewriteRule ^/cgi/viewcontent\.cgi$ %1 [R=301,L,QSD,NE]

RewriteCond %{QUERY_STRING} (?:^|&)context=([^&]+)
RewriteCond ${dcarticle:${lc:%1}/%{ENV:DC_ARTICLE}|NONE} =GONE
RewriteRule ^/cgi/viewcontent\.cgi$ - [G]

RewriteCond ${dcarticle:${lc:$1}/$2|NONE} ^(https://.+)$
RewriteRule ^/context/([^/]+)/article/(\d+)(?:/|$) %1 [R=301,L,QSD,NE]

RewriteCond ${dcarticle:${lc:$1}/$2|NONE} =GONE
RewriteRule ^/context/([^/]+)/article/(\d+)(?:/|$) - [G]

# ---------------------------------------------------------------------------
# Any other old address listed in redirects.csv, 301:
#   /unigreek_images/1   /unigreek_images/1/   /UNIGREEK_IMAGES/   /pias/vol94/iss4/3
# ---------------------------------------------------------------------------

RewriteCond ${dcpath:${lc:$1}|NONE} ^(https://.+)$
RewriteRule ^/(.+?)/*$ %1 [R=301,L,QSD,NE]

RewriteCond ${dcpath:${lc:$1}|NONE} =GONE
RewriteRule ^/(.+?)/*$ - [G]

# Pages inside a listed collection that aren't listed themselves go to the
# collection: /unigreek_images/about.html, /unigreek_images/index.2.html (paging).
RewriteCond ${dcpath:${lc:$1}|NONE} ^(https://.+)$
RewriteRule ^/([^/]+)/[^/]+\.html$ %1 [R=301,L,QSD,NE]

# Repository home page.
RewriteRule ^/$ ${PRESERVICA_HOME} [R=301,L,QSD,NE]

# Anything else falls through to a 404 served by ErrorDocument (see vhost).
