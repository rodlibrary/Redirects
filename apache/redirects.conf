# UNI ScholarWorks (Digital Commons) -> Preservica redirects.
#
# Include this file inside the <VirtualHost> for scholarworks.uni.edu
# (see apache/vhost-example.conf). ARK resolution lives in apache/ark.conf.
#
# Requires: mod_rewrite, and these defined before the Include:
#   Define REDIRECT_MAP_DIR  /etc/httpd/redirects/current   (DBM maps from deploy/pull_maps.sh)
#   Define PRESERVICA_HOME   https://digital.library.uni.edu/
#
# Map files are DBM databases built by httxt2dbm. Apache re-reads a map whenever
# its modification time changes, so new maps take effect without a reload.
#
# NE (no escape) on each redirect sends the stored URL out exactly as written.
# Without it Apache re-encodes %, turning Preservica's sdb%3AIO%7C... into the
# broken sdb%253AIO%257C.... validate.py makes sure stored URLs are already encoded.

RewriteEngine On

RewriteMap dcpath    "dbm:${REDIRECT_MAP_DIR}/dc_paths.db"
RewriteMap dcarticle "dbm:${REDIRECT_MAP_DIR}/dc_article.db"
RewriteMap lc        int:tolower

# ---------------------------------------------------------------------------
# Legacy file URLs (keyed by context/article number), 301 permanent.
#   /cgi/viewcontent.cgi?article=1124&context=etd   (parameters in any order)
#   /context/etd/article/1124/viewcontent/anything.pdf
# ---------------------------------------------------------------------------

RewriteCond %{QUERY_STRING} (?:^|&)article=(\d+)(?:&|$)
RewriteRule ^/cgi/viewcontent\.cgi$ - [E=DC_ARTICLE:%1]

RewriteCond %{QUERY_STRING} (?:^|&)context=([^&]+)
RewriteCond ${dcarticle:${lc:%1}/%{ENV:DC_ARTICLE}|NONE} ^(https://.+)$
RewriteRule ^/cgi/viewcontent\.cgi$ %1 [R=301,L,QSD,NE]

RewriteCond %{QUERY_STRING} (?:^|&)context=([^&]+)
RewriteCond ${dcarticle:${lc:%1}/%{ENV:DC_ARTICLE}|NONE} =GONE
RewriteRule ^/cgi/viewcontent\.cgi$ - [G]

RewriteCond ${dcarticle:${lc:$1}/$2|NONE} ^(https://.+)$
RewriteRule ^/context/([^/]+)/article/(\d+)(?:/|$) %1 [R=301,L,QSD,NE]

RewriteCond ${dcarticle:${lc:$1}/$2|NONE} =GONE
RewriteRule ^/context/([^/]+)/article/(\d+)(?:/|$) - [G]

# ---------------------------------------------------------------------------
# Landing pages, series, journals, volumes and issues, 301 permanent.
#   /etd/123/   /etd/123   /etd/   /journal-stem-arts/
#   /pias/vol94/iss4/3   /pias/vol94/iss4/   /pias/vol94/
# Series and journal names may contain hyphens.
# ---------------------------------------------------------------------------

RewriteCond ${dcpath:${lc:$1}|NONE} ^(https://.+)$
RewriteRule ^/([A-Za-z0-9_][A-Za-z0-9_-]*(?:/\d+|/vol\w+(?:/iss\w+(?:/\d+)?)?)?)/?$ %1 [R=301,L,QSD,NE]

RewriteCond ${dcpath:${lc:$1}|NONE} =GONE
RewriteRule ^/([A-Za-z0-9_][A-Za-z0-9_-]*(?:/\d+|/vol\w+(?:/iss\w+(?:/\d+)?)?)?)/?$ - [G]

# Pages inside a series or journal with no Preservica equivalent go to that
# collection: /pias/about.html, /pias/topdownloads.html, /etd/index.2.html (paging).
RewriteCond ${dcpath:${lc:$1}|NONE} ^(https://.+)$
RewriteRule ^/([A-Za-z0-9_][A-Za-z0-9_-]*)/[^/]+\.html$ %1 [R=301,L,QSD,NE]

# Repository home page.
RewriteRule ^/$ ${PRESERVICA_HOME} [R=301,L,QSD,NE]

# Anything else falls through to a 404 served by ErrorDocument (see vhost).
