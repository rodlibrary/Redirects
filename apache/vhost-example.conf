# Example production virtual hosts. Copy to your Apache config directory
# (e.g. /etc/httpd/conf.d/ on RHEL, /etc/apache2/sites-available/ on Debian/Ubuntu),
# adjust hostnames, certificate paths and the Preservica URL, then:
#     apachectl configtest && apachectl graceful
#
# Modules needed: rewrite, ssl, headers, log_config.

Define REDIRECT_MAP_DIR /etc/httpd/redirects/current
Define REDIRECT_DOCROOT /etc/httpd/redirects/www
Define PRESERVICA_HOME  https://digital.library.uni.edu/
Define ARK_NAAN         32498

# Requests that matched nothing (404) or were withdrawn (410). Review these
# regularly; they show what the manifest is missing.
LogFormat "%t %>s %{Host}i \"%r\" \"%{Referer}i\" \"%{User-Agent}i\"" redirect_miss

<VirtualHost *:80>
    ServerName  scholarworks.uni.edu
    # Send plain-HTTP traffic to HTTPS first, keeping the path and query.
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName  scholarworks.uni.edu

    SSLEngine on
    SSLCertificateFile    /etc/pki/tls/certs/scholarworks.uni.edu.crt
    SSLCertificateKeyFile /etc/pki/tls/private/scholarworks.uni.edu.key

    DocumentRoot "${REDIRECT_DOCROOT}"
    <Directory "${REDIRECT_DOCROOT}">
        Require all granted
        Options None
        AllowOverride None
    </Directory>

    ErrorDocument 404 /moved.html
    ErrorDocument 410 /moved.html

    # ARKs first (they also resolve here), then the legacy ScholarWorks URLs.
    Include /etc/httpd/redirects/ark.conf
    Include /etc/httpd/redirects/redirects.conf

    ErrorLog  logs/redirects_error.log
    CustomLog logs/redirects_access.log combined
    CustomLog logs/redirects_miss.log redirect_miss "expr=%{REQUEST_STATUS} in {'404','410'}"
</VirtualHost>
