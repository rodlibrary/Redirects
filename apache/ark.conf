# ARK resolution for NAAN 32498 (Rod Library, University of Northern Iowa).
#
# The ARK Alliance registry forwards https://n2t.net/ark:/32498/... to
# https://library.uni.edu/ark:/32498/..., so this file belongs in the
# library.uni.edu virtual host (see apache/library-vhost-example.conf). It can also
# be included on scholarworks.uni.edu so ARKs resolve there too.
#
# Requires mod_rewrite, and these defined before the Include:
#   Define REDIRECT_MAP_DIR  /etc/httpd/redirects/current   (built by scripts/install_maps.sh)
#   Define ARK_NAAN          32498
#
# Include it BEFORE any other RewriteRule in the virtual host: the hyphen-stripping
# rule restarts rule processing, and only /ark:/32498/... requests are touched.
#
# Handles /ark:/32498/x7k9q, /ark:32498/x7k9q, hyphens anywhere in the name
# (insignificant in ARKs), and a trailing slash. Resolves with 302: the ARK is the
# persistent name and where it points may change, so clients shouldn't cache it.
# ARKs under any other NAAN fall through to the site's normal handling.
#
# ARKs come from the optional "ark" column of redirects.csv. With no ARKs listed,
# every /ark:/32498/... request gets a 404.

RewriteEngine On

RewriteMap arkmap "dbm:${REDIRECT_MAP_DIR}/ark.db"
RewriteMap arklc  int:tolower

# Strip hyphens from the name, one per pass (bounded loop).
RewriteRule ^/ark:/?${ARK_NAAN}/([^-]*)-(.*)$ /ark:/${ARK_NAAN}/$1$2 [N=64]

# The NAAN is captured from the URL ($1) rather than written as ${ARK_NAAN} inside the
# lookup: Apache doesn't substitute Defines nested inside a ${map:...} expression.
RewriteCond ${arkmap:$1/${arklc:$2}|NONE} ^(https://.+)$
RewriteRule ^/ark:/?(${ARK_NAAN})/(.+?)/?$ %1 [R=302,L,QSD,NE]

RewriteCond ${arkmap:$1/${arklc:$2}|NONE} =GONE
RewriteRule ^/ark:/?(${ARK_NAAN})/(.+?)/?$ - [G]

# Known NAAN, unknown name: say so plainly rather than letting the site's CMS answer.
RewriteRule ^/ark:/?${ARK_NAAN}/ - [R=404,L]
