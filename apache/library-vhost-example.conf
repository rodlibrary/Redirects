# ARK resolution on library.uni.edu (Apache).
#
# NAAN 32498 is registered to Rod Library with the target
# https://library.uni.edu/ark:/${content}, so n2t.net and arks.org send every
# ARK request here. These lines make library.uni.edu answer them directly from the
# same maps the ScholarWorks redirect server uses. Only /ark:/32498/... and
# /ark:32498/... are touched; the rest of the library website is unaffected.
#
# Setup on the library.uni.edu server:
#   1. Set up the repository and lookup files as in the README ("Set up a server"),
#      with SMOKE_HOST=library.uni.edu and SMOKE_ONLY=ark for install_maps.sh.
#   2. Copy apache/ark.conf to /etc/httpd/redirects/ark.conf
#   3. Add the lines below, then:  apachectl configtest && systemctl reload httpd
#
# If library.uni.edu and scholarworks.uni.edu end up on the same Apache server,
# skip the second set-up: both virtual hosts read the same /etc/httpd/redirects/current.
#
# Modules needed: rewrite (already standard).

# At server level (outside any VirtualHost), once:
Define REDIRECT_MAP_DIR /etc/httpd/redirects/current
Define ARK_NAAN         32498

# Inside the EXISTING library.uni.edu <VirtualHost *:443> (and *:80 if it serves
# content over plain HTTP), placed BEFORE any other RewriteRule in that host:
#
#   Include /etc/httpd/redirects/ark.conf
#
# Optional: log ARK requests separately to see what gets cited.
#   CustomLog logs/ark_access.log combined "expr=%{REQUEST_URI} =~ m#^/ark:#"

# ---------------------------------------------------------------------------
# Fallback, only if the maps can't be installed on library.uni.edu:
# forward ARK requests to the redirect server instead (needs mod_proxy,
# mod_proxy_http, mod_ssl). Use this INSTEAD of the Include above.
#
#   SSLProxyEngine on
#   RewriteEngine  on
#   RewriteRule ^/(ark:/?32498/.*)$ https://scholarworks.uni.edu/$1 [P,L]
# ---------------------------------------------------------------------------
