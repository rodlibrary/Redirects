# Manual: rebuild manifest/redirects.csv from Digital Commons and Preservica, and open
# a pull request with the result for review. Run it from Actions > Refresh manifest >
# Run workflow.
#
#   method = identifiers  look each item up by its dc_article / dc_series identifier
#                         in Preservica (match_preservica.py)
#   method = titles       for Assets without those identifiers: list Preservica and
#                         match by title (match_by_title.py)
#
# Needs the repository secrets PRESERVICA_USER and PRESERVICA_PASSWORD. Rows already
# resolved, including references typed in by hand, are always kept.
name: Refresh manifest

on:
  workflow_dispatch:
    inputs:
      method:
        description: "How to find each item in Preservica"
        type: choice
        options: [identifiers, titles]
        default: identifiers
      skip_harvest:
        description: "Reuse the committed staging/dc_items.csv (tick once Digital Commons is switched off)"
        type: boolean
        default: false
      root_folder:
        description: "Titles only: list just this Preservica Folder (reference or portal address); blank = everything"
        required: false
        default: ""

permissions:
  contents: write        # push the branch with the new manifest
  pull-requests: write   # open the pull request
  actions: write         # start the checks on that branch

concurrency:
  group: refresh-manifest
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PRESERVICA_USER: ${{ secrets.PRESERVICA_USER }}
      PRESERVICA_PASSWORD: ${{ secrets.PRESERVICA_PASSWORD }}
      PRESERVICA_ROOT_FOLDER: ${{ inputs.root_folder }}
      METHOD: ${{ inputs.method }}
      SKIP_HARVEST: ${{ inputs.skip_harvest }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Load settings.env
        run: grep -E '^[A-Z_][A-Z0-9_]*=' settings.env >> "$GITHUB_ENV"

      - name: Check the secrets are set
        run: |
          missing=""
          [ -n "$PRESERVICA_USER" ] || missing="$missing PRESERVICA_USER"
          [ -n "$PRESERVICA_PASSWORD" ] || missing="$missing PRESERVICA_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Add these repository secrets (Settings > Secrets and variables > Actions > Secrets):$missing"
            exit 1
          fi

      - name: Harvest Digital Commons
        if: inputs.skip_harvest != true
        run: python3 scripts/harvest_dc.py --base-url "$DC_OAI_URL" --dc-host "$DC_HOST" --out staging/dc_items.csv

      - name: Match by identifier
        if: inputs.method == 'identifiers'
        run: >
          python3 scripts/match_preservica.py staging/dc_items.csv
          --access-host "$PRESERVICA_ACCESS_HOST"
          --existing manifest/redirects.csv --out manifest/redirects.csv
          --unmatched-report staging/unmatched.csv
          --ark-id-type "${ARK_ID_TYPE:-ark}" --series

      - name: Match by title
        if: inputs.method == 'titles'
        run: |
          python3 scripts/match_preservica.py staging/dc_items.csv \
            --access-host "$PRESERVICA_ACCESS_HOST" \
            --existing manifest/redirects.csv --out manifest/redirects.csv \
            --unmatched-report staging/unmatched.csv --series --no-lookup
          python3 scripts/match_by_title.py --manifest manifest/redirects.csv --items staging/dc_items.csv

      - name: Validate the new manifest
        run: python3 scripts/validate.py manifest/redirects.csv manifest/overrides.csv | tee validate.txt

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: refresh-${{ inputs.method }}-${{ github.run_number }}
          path: |
            manifest/redirects.csv
            staging/
          retention-days: 30
          if-no-files-found: warn

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          branch="refresh-manifest/run-${GITHUB_RUN_NUMBER}"
          git checkout -b "$branch"
          # The reports in staging/ stay in the run's artifact; only these are committed.
          git add manifest/redirects.csv staging/dc_items.csv
          if git diff --cached --quiet; then
            echo "The manifest didn't change; no pull request needed." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -q -m "Refresh manifest (${METHOD}, run ${GITHUB_RUN_NUMBER})"
          git push -q origin "$branch"
          counts=$(grep -E '^status counts' validate.txt || true)
          artifact="refresh-${METHOD}-${GITHUB_RUN_NUMBER}"
          review=""; [ "$METHOD" = titles ] && review=" and \`staging/title_match_review.csv\`"
          reused=""; [ "$SKIP_HARVEST" = true ] && reused=", reusing the committed harvest"
          body="Manifest rebuilt by the **Refresh manifest** workflow (method: ${METHOD}${reused}).

          ${counts}

          Review the changes to \`manifest/redirects.csv\` on the **Files changed** tab. Items that couldn't be matched are listed in \`staging/unmatched.csv\`${review} in the run's **${artifact}** artifact: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Merging publishes the new maps to the servers within about 15 minutes."
          if gh pr create --base main --head "$branch" --title "Refresh manifest (${METHOD}, run ${GITHUB_RUN_NUMBER})" --body "$body"; then
            # Pull requests opened by a workflow don't start other workflows by themselves.
            gh workflow run checks.yml --ref "$branch"
            echo "Opened a pull request from \`$branch\`; the checks are running on it." >> "$GITHUB_STEP_SUMMARY"
          else
            msg="Pushed branch $branch, but couldn't open the pull request (turn on Settings > Actions > General > Allow GitHub Actions to create and approve pull requests). Open it by hand: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${branch}"
            echo "::warning::$msg"; echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            gh workflow run checks.yml --ref "$branch" || true
          fi
