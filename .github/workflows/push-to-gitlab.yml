# Push redirects.csv (built from arks/arks_manifest.csv) and the ARK master list to the
# GitLab redirect repository whenever either changes on main, or on demand.
# Files that are already the same in GitLab are skipped, so nothing is committed there
# unless something changed.
name: Push to GitLab

on:
  push:
    branches: [main]
    paths:
      - arks/arks_manifest.csv
      - arks/ark_master_list.csv
      - settings.env
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report what would change in GitLab"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: push-to-gitlab
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Load settings.env
        run: grep -E '^[A-Z_][A-Z0-9_]*=' settings.env >> "$GITHUB_ENV"
      - name: Check the secret is set
        run: |
          if [ -z "$GITLAB_TOKEN" ]; then
            echo "::error::Add the repository secret GITLAB_TOKEN (Settings > Secrets and variables > Actions > Secrets)"
            exit 1
          fi
      - name: Check the ARK manifest
        run: python3 arks/ark_manifest.py check
      - name: Build redirects.csv
        run: mkdir -p build && python3 arks/ark_manifest.py redirects --out build/redirects.csv
      - name: Push to GitLab
        env:
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: >
          python3 arks/push_to_gitlab.py ${DRY_RUN:+"$DRY_RUN"}
          "build/redirects.csv:$GITLAB_REDIRECTS_PATH"
          "arks/ark_master_list.csv:$GITLAB_MASTER_LIST_PATH"
