# Find each ARK in Preservica's MODS metadata and record the record it belongs to.
# Runs every Monday and on demand (Actions > Match ARKs in Preservica > Run workflow).
# When anything changed, it opens a pull request with the updated
# arks/arks_manifest.csv; merging it pushes the new redirects.csv to GitLab.
name: Match ARKs in Preservica

on:
  schedule:
    - cron: "47 11 * * 1"   # Mondays 11:47 UTC (6:47 am Central daylight time, 5:47 am standard time)
  workflow_dispatch:

permissions:
  contents: write        # push the branch
  pull-requests: write   # open the pull request
  actions: write         # start the checks on it

concurrency:
  group: arks-manifest
  cancel-in-progress: false

jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PRESERVICA_USER: ${{ secrets.PRESERVICA_USER }}
      PRESERVICA_PASSWORD: ${{ secrets.PRESERVICA_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Load settings.env
        run: grep -E '^[A-Z_][A-Z0-9_]*=' settings.env >> "$GITHUB_ENV"
      - name: Check the secrets are set
        run: |
          missing=""
          [ -n "$PRESERVICA_USER" ] || missing="$missing PRESERVICA_USER"
          [ -n "$PRESERVICA_PASSWORD" ] || missing="$missing PRESERVICA_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Add these repository secrets (Settings > Secrets and variables > Actions > Secrets):$missing"
            exit 1
          fi
      - name: Add ARKs from the master list
        run: python3 arks/ark_manifest.py sync
      - name: Match in Preservica
        id: match
        run: python3 arks/ark_manifest.py match --summary match_report.md
      - name: Check the result
        run: python3 arks/ark_manifest.py check
      - name: Report
        run: cat match_report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Open a pull request
        if: steps.match.outputs.changed != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Updated by the **Match ARKs in Preservica** workflow."
            echo
            cat match_report.md
            echo
            echo "Review the changes to \`arks/arks_manifest.csv\` on the **Files changed** tab, mainly the \`preservica_ref\`, \`match\` and \`notes\` columns. Merging pushes the new \`redirects.csv\` to GitLab."
          } > pr_body.md
          .github/scripts/open_pr.sh "match-arks/run-${GITHUB_RUN_NUMBER}" \
            "Match ARKs in Preservica (run ${GITHUB_RUN_NUMBER})" pr_body.md arks/arks_manifest.csv
