# Mint new ARKs for the rows in arks/new_arks.csv (Actions > Mint ARKs > Run workflow).
# It runs arks/generate_arks.py against the master list, so no ARK is ever issued twice,
# adds the new ARKs to arks/arks_manifest.csv, empties arks/new_arks.csv again, and
# opens a pull request. The ANVL records for N2T/EZID are in the run's artifact.
# Merging the pull request pushes the new ARKs to GitLab.
name: Mint ARKs

on:
  workflow_dispatch:
    inputs:
      add_checksum:
        description: "Append a NOID check character to each ARK"
        type: boolean
        default: false

permissions:
  contents: write        # push the branch
  pull-requests: write   # open the pull request
  actions: write         # start the checks on it

concurrency:
  group: arks-manifest
  cancel-in-progress: false

jobs:
  mint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Load settings.env
        run: grep -E '^[A-Z_][A-Z0-9_]*=' settings.env >> "$GITHUB_ENV"
      - name: Stop if an earlier minting run is still waiting to be merged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh pr list --state open --json headRefName,url --jq '.[] | select(.headRefName | startswith("mint-arks/")) | .url')
          if [ -n "$open" ]; then
            echo "::error::Merge or close the earlier Mint ARKs pull request first ($open). Minting again before then could issue a second ARK for the same items."
            exit 1
          fi
      - name: Check there is something to mint
        run: |
          rows=$(python3 -c "import csv; print(sum(1 for r in csv.DictReader(open('arks/new_arks.csv', encoding='utf-8-sig')) if any(v.strip() for v in r.values() if v)))")
          if [ "$rows" = 0 ]; then
            echo "::error::arks/new_arks.csv has no rows. Add one row per item (identifier and title at least), merge that, then run this again."
            exit 1
          fi
          echo "Minting ARKs for $rows row(s)." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Mint
        env:
          CHECKSUM: ${{ inputs.add_checksum && '--add-checksum' || '' }}
        run: |
          mkdir -p build
          python3 arks/generate_arks.py arks/new_arks.csv build/minted \
            --naan "$ARK_NAAN" --master-list arks/ark_master_list.csv --no-redirects-manifest ${CHECKSUM:+"$CHECKSUM"}
      - name: Add the new ARKs to the manifest
        run: python3 arks/ark_manifest.py add-minted build/minted.csv | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Empty arks/new_arks.csv for next time
        run: head -n 1 arks/new_arks.csv > build/header.csv && mv build/header.csv arks/new_arks.csv
      - name: Check the result
        run: python3 arks/ark_manifest.py check
      - uses: actions/upload-artifact@v6
        with:
          name: minted-arks-${{ github.run_number }}
          path: |
            build/minted.csv
            build/minted.anvl
          retention-days: 90
      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(($(wc -l < build/minted.csv) - 1))
          {
            echo "Minted by the **Mint ARKs** workflow: ${count} row(s) from \`arks/new_arks.csv\`."
            echo
            echo "- \`arks/ark_master_list.csv\` and \`arks/arks_manifest.csv\` have the new ARKs."
            echo "- The per-run \`minted.csv\` and the ANVL records (\`minted.anvl\`) for N2T/EZID are in the run's **minted-arks-${GITHUB_RUN_NUMBER}** artifact: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "Merge this before minting again. Merging pushes the new ARKs to GitLab; the next **Match ARKs in Preservica** run fills in their Preservica records."
          } > pr_body.md
          .github/scripts/open_pr.sh "mint-arks/run-${GITHUB_RUN_NUMBER}" \
            "Mint ${count} ARK(s) (run ${GITHUB_RUN_NUMBER})" pr_body.md \
            arks/ark_master_list.csv arks/arks_manifest.csv arks/new_arks.csv
