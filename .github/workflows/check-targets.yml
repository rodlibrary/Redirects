# Weekly: check that every active redirect target still resolves in Preservica.
# Failing targets are listed in the run's target-failures artifact, and the run is
# marked failed, so GitHub emails whoever last edited this schedule.
name: Check redirect targets

on:
  schedule:
    - cron: "17 11 * * 1"   # Mondays 11:17 UTC (6:17 am Central daylight time, 5:17 am standard time)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check_targets:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Load settings.env
        run: grep -E '^[A-Z_][A-Z0-9_]*=' settings.env >> "$GITHUB_ENV"
      - name: Check every target
        run: >
          python3 scripts/check_targets.py manifest/redirects.csv manifest/overrides.csv
          --report target_failures.csv --pause 0.5
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: target-failures
          path: target_failures.csv
          retention-days: 90
          if-no-files-found: ignore
